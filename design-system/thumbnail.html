<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}.tile{display:grid;grid-template-columns:1fr 148px;width:1280px;height:854px}.mark{display:flex;align-items:center;justify-content:center;gap:36px;background:var(--ink-900);padding:0 40px}.mark span{font-family:var(--font-display);font-weight:700;font-size:88px;letter-spacing:-0.03em;color:var(--lime-500);white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head><body><div class="tile">
<div class="mark"><img src="assets/logo-mark.svg" width="200" height="200" alt=""><span>Badminton<br>Vision</span></div>
<div class="strip"><i style="background:#c8f04a"></i><i style="background:#3fd48b"></i><i style="background:#ffb020"></i><i style="background:#ff6b5a"></i></div>
</div></body></html>
