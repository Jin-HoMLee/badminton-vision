<!-- @dsCard group="Brand" viewport="700x180" name="Elevation & glass" subtitle="Panels are blurred dark glass with a hairline inset highlight — no grey drop shadows" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ink-900)}.g{display:flex;gap:8px}.sw{flex:1;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:76px;border:1px solid var(--border-hairline)}.n{font:var(--type-mono);font-size:10px;color:#eef4f6;mix-blend-mode:difference}.h{font:var(--type-mono);font-size:9px;color:var(--slate-300);mix-blend-mode:difference}.lab{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}.r{display:flex;gap:16px;margin-top:12px}.p{flex:1;height:104px;border-radius:12px;border:1px solid var(--border-hairline);background:var(--surface-panel);backdrop-filter:var(--blur-panel);display:flex;align-items:flex-end;padding:10px;font:var(--type-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><span class="lab">On a video-like backdrop</span>
<div class="r" style="background:linear-gradient(115deg,#1d3b2a,#0f2a2f 45%,#2a2f1a);padding:16px;border-radius:12px">
<div class="p" style="box-shadow:var(--shadow-chip)">shadow-chip</div>
<div class="p" style="box-shadow:var(--shadow-panel)">shadow-panel</div>
<div class="p" style="box-shadow:var(--shadow-raised)">shadow-raised</div>
<div class="p" style="box-shadow:var(--shadow-modal)">shadow-modal</div></div></body></html>
