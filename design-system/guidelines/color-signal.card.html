<!-- @dsCard group="Colors" viewport="700x130" name="Semantic signals" subtitle="IN / OUT / stale / info / unknown — unknown is a first-class colour" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ink-900)}.g{display:flex;gap:8px}.sw{flex:1;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:76px;border:1px solid var(--border-hairline)}.n{font:var(--type-mono);font-size:10px;color:#eef4f6;mix-blend-mode:difference}.h{font:var(--type-mono);font-size:9px;color:var(--slate-300);mix-blend-mode:difference}.lab{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div class="g"><div class="sw" style="background:#3fd48b"><span class="n">signal-in</span><span class="h">IN · winner</span></div><div class="sw" style="background:#ff6b5a"><span class="n">signal-out</span><span class="h">OUT · error</span></div><div class="sw" style="background:#ffb020"><span class="n">signal-warn</span><span class="h">stale · suggested</span></div><div class="sw" style="background:#62b6ff"><span class="n">signal-info</span><span class="h">corrected</span></div><div class="sw" style="background:#7a8b96"><span class="n">signal-unknown</span><span class="h">unclassified</span></div></div></body></html>
